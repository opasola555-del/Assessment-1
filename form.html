<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Sign In</title>
</head>
<body>
    <header>
        <nav>
            <a href="#">Sign up</a>
            |
            <strong>Sign in</strong>
        </nav>
    </header>
    <main>
        <h1>Sign in</h1>
        <p>
            Enter your email address and password to securely log in to
            AltSchool Student Portal
        </p>
        <form>
            <fieldset disabled>
                <p>
                    <label for="email">Email</label><br>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="feelbliss@example.com"
                    >
                </p>
                <p>
                    <label for="password">Password</label><br>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="*****"
                    >
                </p>

                <p>
                    <button type="button">
                        Proceed to Dashboard →
                    </button>
                </p>
            </fieldset>
        </form>
        <p>
            Forgot your password?
            <a href="#">Reset Now!</a>
        </p>
        <hr>
        <p>OR</p>
        <button type="button" disabled>
            Login with Google
        </button>
    </main>
